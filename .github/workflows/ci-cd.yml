
name: Student Placement CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-train-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code quality check
        run: flake8 train.py app.py test_app.py --max-line-length=100

      - name: Train and evaluate model
        run: python train.py

      - name: Verify model file
        run: python -c "import os; assert os.path.exists('model.pkl')"

      - name: Run unit tests and API tests
        run: pytest -v

      - name: Start API and test it
        shell: bash
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true' EXIT
          python -c "import time, urllib.request; \
          url='http://127.0.0.1:8000/'; \
          exec('for i in range(30):\n try:\n  urllib.request.urlopen(url, timeout=2); break\n except Exception:\n  time.sleep(1)\nelse:\n raise SystemExit(\"API failed to start\")')"
          python -c "import json, urllib.request; \
          req=urllib.request.Request('http://127.0.0.1:8000/predict', \
          data=json.dumps({'cgpa':8.5,'attendance':92,'coding_score':85,'projects':3,'internships':2,'communication_skills':88}).encode(), \
          headers={'Content-Type':'application/json'}, method='POST'); \
          response=json.load(urllib.request.urlopen(req, timeout=10)); \
          assert response['prediction'] in ['Placed','Not Placed']; \
          print(response)"

      - name: CI-CD passed
        run: echo "All quality checks passed. Deployment may proceed."

    
  deploy-to-vercel:
    name: CD - Deploy Application
    needs: validate-train-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      
      - name: Install uv for Python build
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Build production deployment
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy application
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
